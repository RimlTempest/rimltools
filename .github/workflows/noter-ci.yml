name: noter CI

on:
  workflow_call:

# 既定は何も無し。ジョブごとに必要な権限だけ足す（docs/security.md）。
permissions: {}

defaults:
  run:
    working-directory: products/noter

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      markup: ${{ steps.filter.outputs.markup }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'products/noter/apps/**'
              - 'products/noter/features/**'
              - 'products/noter/shared/**'
              - 'products/noter/e2e/**'
              - 'products/noter/scripts/**'
              - 'products/noter/tsconfig*.json'
              - 'products/noter/.oxlintrc.json'
              - 'products/noter/package.json'
              - 'bun.lock'
            markup:
              - 'products/noter/**/*.tsx'
              - 'products/noter/.markuplintrc.json'
            web:
              - 'products/noter/apps/**'
              - 'products/noter/features/**'
              - 'products/noter/shared/ui/**'
              - 'products/noter/e2e/**'

  guard:
    name: 不変条件の検査
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: noter-sync は公開されていないこと (ADR-0002)
        run: |
          if grep -qE '^\s*"routes"\s*:' apps/sync/wrangler.jsonc; then
            echo "::error file=apps/sync/wrangler.jsonc::noter-sync must not be reachable from the internet. Remove 'routes' (ADR-0002)."
            exit 1
          fi
          # workers_dev は既定が true。routes が無くても
          # noter-sync.<subdomain>.workers.dev で公開されるので、明示的な false を要求する。
          if ! grep -qE '^\s*"workers_dev"\s*:\s*false\s*,?\s*$' apps/sync/wrangler.jsonc; then
            echo "::error file=apps/sync/wrangler.jsonc::noter-sync must set \"workers_dev\": false. It defaults to true and publishes the Worker on workers.dev even without routes (ADR-0002)."
            exit 1
          fi
      - name: 従量課金されるバインディングを足していないこと (ADR-0009)
        run: |
          # R2 は Cloudflare 側で利用上限を設定できず、超過分が従量課金される。
          # 「無料で運用する」を構造的に守るため、宣言そのものを禁じる。
          # KV は課金されないが、用途が無いので併せて弾く（ADR-0009）。
          for f in apps/web/wrangler.jsonc apps/sync/wrangler.jsonc; do
            if grep -qE '^\s*"(r2_buckets|kv_namespaces)"\s*:' "$f"; then
              echo "::error file=$f::R2/KV bindings are forbidden. R2 has no spending cap and would break free-tier operation (ADR-0009)."
              exit 1
            fi
          done
      - name: Durable Object は SQLite backed であること (ADR-0009)
        run: |
          # new_classes（key-value backed）は Paid プラン限定。Free では
          # new_sqlite_classes しか使えない。
          if grep -qE '"new_classes"' apps/sync/wrangler.jsonc; then
            echo "::error file=apps/sync/wrangler.jsonc::use new_sqlite_classes (ADR-0009)"
            exit 1
          fi
      - name: class は Durable Object の殻だけであること (ADR-0004)
        run: |
          # .d.ts は生成物・型定義なので対象外（wrangler types / @types/react が class を含む）
          hits=$(grep -rlE '^\s*(export\s+)?(abstract\s+)?class\s' \
            --include='*.ts' --include='*.tsx' --exclude='*.d.ts' \
            --exclude-dir=node_modules --exclude-dir=dist \
            shared features apps scripts \
            | grep -v 'features/sync/worker/document-room.ts' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::class is only allowed in features/sync/worker/document-room.ts (ADR-0004)"
            exit 1
          fi
      - name: 開発用の WS 開放フラグが設定に混ざっていないこと (plan 002)
        run: |
          # NOTER_DEV_OPEN_WS は認可を丸ごと素通りさせる。.dev.vars と e2e の
          # 起動環境にだけ置き、デプロイされる設定には絶対に載せない。
          if grep -q 'NOTER_DEV_OPEN_WS' apps/web/wrangler.jsonc apps/sync/wrangler.jsonc; then
            echo "::error file=apps/web/wrangler.jsonc::NOTER_DEV_OPEN_WS must never be declared in wrangler config. It bypasses authorization for /ws."
            exit 1
          fi
      - name: ドメイン層に I/O が漏れていないこと
        run: |
          hits=$(find shared/contract/src features/*/contract features/*/core -name '*.ts' ! -name '*.test.ts' -print0 2>/dev/null \
            | xargs -0 -r grep -nE '\b(fetch|localStorage|process\.env)\b' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::contract and core layers must stay I/O free. Inject dependencies instead."
            exit 1
          fi
      - name: feature 同士が内部を直接 import していないこと (ADR-0007)
        run: |
          hits=$(find features \( -name '*.ts' -o -name '*.tsx' \) -print0 2>/dev/null \
            | xargs -0 -r grep -nE "from '\\.\\./\\.\\./[a-z-]+/(contract|core|ui|server|client|worker)/" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::features must not reach into each other by relative path. Import via the '@noter/<feature>' entry points."
            exit 1
          fi

  fmt-lint:
    name: fmt + lint (oxfmt / oxlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint

  typecheck:
    name: typecheck (TypeScript 7)
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-ts:
    name: test (bun)
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run test

  markuplint:
    name: markuplint (a11y)
    needs: changes
    if: needs.changes.outputs.markup == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run lint:html

  build-and-a11y:
    name: build + axe (WCAG AAA)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --filter '@noter/e2e' install-browsers
      - run: bun run a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: products/noter/e2e/playwright-report/
          retention-days: 7
