name: Terraform

# infra/terraform（Cloudflare / GitHub、ADR-0005）と infra/grafana（Grafana Cloud、ADR-0008）の
# 検査・plan・apply。CLI は OpenTofu（tofu）、state は自前の http backend（infra/tfstate）、
# 資格情報は SOPS で暗号化した infra/secrets（ADR-0009）。infra/grafana のジョブは *-grafana。
# - PR: fmt / validate / tflint / checkov は常に。plan 鍵があれば plan を PR にコメント
# - main への push: apply（environment `production`、apply 鍵）
# SOPS の鍵や secrets ファイルが未登録の間は plan / apply をスキップする。
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'infra/terraform/**'
      - 'infra/grafana/**'
      - 'infra/secrets/**'
      - '.sops.yaml'
      - 'observability/**'
      - 'tools.json'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/grafana/**'
      - 'infra/secrets/**'
      - '.sops.yaml'
      - 'observability/**'
      - 'tools.json'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  static:
    name: tofu (fmt / validate / tflint / checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install_args: opentofu
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - run: tflint --init && tflint --recursive
        env:
          # tflint --init が GitHub API の rate limit に当たらないように
          GITHUB_TOKEN: ${{ github.token }}
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          compact: true

  plan:
    name: tofu plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      # plan は PR のコード（= まだレビュー前のコード）を実行する。読み取り専用の資格情報だけを
      # 復号できる plan 鍵（repository secret）を使う。書き込み用の apply.sops.yaml はこの鍵では開けない。
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PLAN }}
      SECRETS_FILE: ../secrets/plan.sops.yaml
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_access_emails: ${{ vars.TF_VAR_ACCESS_EMAILS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 資格情報が登録済みか
        id: creds
        run: |
          if [ -n "$SOPS_AGE_KEY" ] && [ -f "$SECRETS_FILE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SOPS age key or $SECRETS_FILE is not set up yet (docs/bootstrap.md). Skipping plan."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.creds.outputs.configured == 'true'
        with:
          cache: true
          install_args: opentofu sops
      - name: SOPS の値をログから伏せる
        if: steps.creds.outputs.configured == 'true'
        # 復号した値は GitHub の secret として登録されていないので、自動では伏せ字にならない。
        # 使う前に 1 つずつ add-mask する（値そのものはこの行でしか出力されず、ログには *** で出る）
        run: |
          sops decrypt --output-type dotenv "$SECRETS_FILE" | while IFS= read -r line; do
            value="${line#*=}"
            if [ -n "$value" ]; then echo "::add-mask::${value}"; fi
          done
      - name: tofu plan
        id: plan
        if: steps.creds.outputs.configured == 'true'
        run: |
          # 資格情報は sops exec-env でこのコマンドの環境変数にだけ渡す（ファイルにもログにも書かない）
          sops exec-env "$SECRETS_FILE" 'tofu init -input=false -no-color && tofu plan -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1; echo $? > plan.exit' || true
          code=$(cat plan.exit 2>/dev/null || echo 1)
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = 差分なし、2 = 差分あり、1 = 失敗
          [ "$code" -ne 1 ]
      - name: plan を PR にコメント
        if: always() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('node:fs')
            const raw = fs.existsSync('infra/terraform/plan.txt') ? fs.readFileSync('infra/terraform/plan.txt', 'utf8') : '(no output)'
            const body = raw.length > 60000 ? `…(truncated)\n${raw.slice(-60000)}` : raw
            const marker = '<!-- rimltools:terraform-plan -->'
            const status = { '0': '差分なし', '2': '差分あり' }[process.env.PLAN_EXIT] ?? '失敗'
            const text = `${marker}\n### tofu plan: ${status}\n\n<details><summary>plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text })

  apply:
    name: tofu apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    env:
      # 書き込み用の資格情報は apply.sops.yaml にあり、apply 鍵でしか開けない。apply 鍵は
      # production environment の secret にだけ置き、environment は main からしか使えない（github.tf）。
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_APPLY }}
      SECRETS_FILE: ../secrets/apply.sops.yaml
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_access_emails: ${{ vars.TF_VAR_ACCESS_EMAILS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 資格情報が登録済みか
        id: creds
        run: |
          if [ -n "$SOPS_AGE_KEY" ] && [ -f "$SECRETS_FILE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SOPS age key or $SECRETS_FILE is not set up yet (docs/bootstrap.md). Skipping apply."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.creds.outputs.configured == 'true'
        with:
          cache: true
          install_args: opentofu sops
      - name: SOPS の値をログから伏せる
        if: steps.creds.outputs.configured == 'true'
        # 復号した値は GitHub の secret として登録されていないので、自動では伏せ字にならない。
        # 使う前に 1 つずつ add-mask する（値そのものはこの行でしか出力されず、ログには *** で出る）
        run: |
          sops decrypt --output-type dotenv "$SECRETS_FILE" | while IFS= read -r line; do
            value="${line#*=}"
            if [ -n "$value" ]; then echo "::add-mask::${value}"; fi
          done
      - name: tofu apply
        if: steps.creds.outputs.configured == 'true'
        run: sops exec-env "$SECRETS_FILE" 'tofu init -input=false -no-color && tofu apply -auto-approve -no-color'

  # --- infra/grafana（Grafana Cloud: LGTM / SLO / IRM / Synthetic / Faro、ADR-0008） ---------

  static-grafana:
    name: tofu grafana (fmt / validate / tflint / checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install_args: opentofu
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - run: tflint --init && tflint --recursive
        env:
          # tflint --init が GitHub API の rate limit に当たらないように
          GITHUB_TOKEN: ${{ github.token }}
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra/grafana
          framework: terraform
          quiet: true
          compact: true

  plan-grafana:
    name: tofu grafana plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: static-grafana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/grafana
    env:
      # plan は PR のコード（= まだレビュー前のコード）を実行する。読み取り専用の資格情報だけを
      # 復号できる plan 鍵（repository secret）を使う。書き込み用の apply.sops.yaml はこの鍵では開けない。
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PLAN }}
      SECRETS_FILE: ../secrets/plan.sops.yaml
      TF_VAR_alert_emails: ${{ vars.GRAFANA_ALERT_EMAILS || '[]' }}
      TF_VAR_oncall_usernames: ${{ vars.GRAFANA_ONCALL_USERNAMES || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 資格情報が登録済みか
        id: creds
        run: |
          if [ -n "$SOPS_AGE_KEY" ] && [ -f "$SECRETS_FILE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SOPS age key or $SECRETS_FILE is not set up yet (docs/bootstrap.md). Skipping plan."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.creds.outputs.configured == 'true'
        with:
          cache: true
          install_args: opentofu sops
      - name: SOPS の値をログから伏せる
        if: steps.creds.outputs.configured == 'true'
        # 復号した値は GitHub の secret として登録されていないので、自動では伏せ字にならない。
        # 使う前に 1 つずつ add-mask する（値そのものはこの行でしか出力されず、ログには *** で出る）
        run: |
          sops decrypt --output-type dotenv "$SECRETS_FILE" | while IFS= read -r line; do
            value="${line#*=}"
            if [ -n "$value" ]; then echo "::add-mask::${value}"; fi
          done
      - name: tofu plan
        id: plan
        if: steps.creds.outputs.configured == 'true'
        run: |
          # 資格情報は sops exec-env でこのコマンドの環境変数にだけ渡す（ファイルにもログにも書かない）
          sops exec-env "$SECRETS_FILE" 'tofu init -input=false -no-color && tofu plan -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1; echo $? > plan.exit' || true
          code=$(cat plan.exit 2>/dev/null || echo 1)
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = 差分なし、2 = 差分あり、1 = 失敗
          [ "$code" -ne 1 ]
      - name: plan を PR にコメント
        if: always() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('node:fs')
            const raw = fs.existsSync('infra/grafana/plan.txt') ? fs.readFileSync('infra/grafana/plan.txt', 'utf8') : '(no output)'
            const body = raw.length > 60000 ? `…(truncated)\n${raw.slice(-60000)}` : raw
            const marker = '<!-- rimltools:terraform-plan-grafana -->'
            const status = { '0': '差分なし', '2': '差分あり' }[process.env.PLAN_EXIT] ?? '失敗'
            const text = `${marker}\n### tofu plan (infra/grafana): ${status}\n\n<details><summary>plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text })

  apply-grafana:
    name: tofu grafana apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # infra/terraform が作る environment（production / staging / ops）に secret を書くので後に回す
    needs: [static-grafana, apply]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/grafana
    env:
      # 書き込み用の資格情報は apply.sops.yaml にあり、apply 鍵でしか開けない。apply 鍵は
      # production environment の secret にだけ置き、environment は main からしか使えない（github.tf）。
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_APPLY }}
      SECRETS_FILE: ../secrets/apply.sops.yaml
      TF_VAR_alert_emails: ${{ vars.GRAFANA_ALERT_EMAILS || '[]' }}
      TF_VAR_oncall_usernames: ${{ vars.GRAFANA_ONCALL_USERNAMES || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 資格情報が登録済みか
        id: creds
        run: |
          if [ -n "$SOPS_AGE_KEY" ] && [ -f "$SECRETS_FILE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SOPS age key or $SECRETS_FILE is not set up yet (docs/bootstrap.md). Skipping apply."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.creds.outputs.configured == 'true'
        with:
          cache: true
          install_args: opentofu sops
      - name: SOPS の値をログから伏せる
        if: steps.creds.outputs.configured == 'true'
        # 復号した値は GitHub の secret として登録されていないので、自動では伏せ字にならない。
        # 使う前に 1 つずつ add-mask する（値そのものはこの行でしか出力されず、ログには *** で出る）
        run: |
          sops decrypt --output-type dotenv "$SECRETS_FILE" | while IFS= read -r line; do
            value="${line#*=}"
            if [ -n "$value" ]; then echo "::add-mask::${value}"; fi
          done
      - name: tofu apply
        if: steps.creds.outputs.configured == 'true'
        run: sops exec-env "$SECRETS_FILE" 'tofu init -input=false -no-color && tofu apply -auto-approve -no-color'
