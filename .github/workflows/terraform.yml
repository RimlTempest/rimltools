name: Terraform

# infra/terraform の検査・plan・apply（ADR-0005）。
# - PR: fmt / validate / tflint / checkov は常に。資格情報があれば plan を PR にコメント
# - main への push: apply（environment `production`）
# 資格情報（HCP / Cloudflare / GitHub）が未登録の間は plan / apply をスキップする。
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'infra/terraform/**'
      - 'tools.json'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'tools.json'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    working-directory: infra/terraform

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  static:
    name: terraform (fmt / validate / tflint / checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: tflint --init && tflint --recursive
        env:
          # tflint --init が GitHub API の rate limit に当たらないように
          GITHUB_TOKEN: ${{ github.token }}
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          compact: true

  plan:
    name: terraform plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
      TF_VAR_github_token: ${{ secrets.TF_VAR_github_token }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_access_emails: ${{ vars.TF_VAR_ACCESS_EMAILS || '[]' }}
    steps:
      - name: 資格情報が登録済みか
        id: creds
        working-directory: .
        run: |
          if [ -n "$TF_TOKEN_app_terraform_io" ] && [ -n "$TF_VAR_cloudflare_api_token" ] && [ -n "$TF_VAR_github_token" ] && [ -n "$TF_CLOUD_ORGANIZATION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Terraform credentials are not registered yet (infra/terraform/README.md). Skipping plan."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - if: steps.creds.outputs.configured == 'true'
        run: terraform init
      - name: terraform plan
        id: plan
        if: steps.creds.outputs.configured == 'true'
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = 差分なし、2 = 差分あり、1 = 失敗
          [ "$code" -ne 1 ]
      - name: plan を PR にコメント
        if: always() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('node:fs')
            const raw = fs.existsSync('infra/terraform/plan.txt') ? fs.readFileSync('infra/terraform/plan.txt', 'utf8') : '(no output)'
            const body = raw.length > 60000 ? `…(truncated)\n${raw.slice(-60000)}` : raw
            const marker = '<!-- rimltools:terraform-plan -->'
            const status = { '0': '差分なし', '2': '差分あり' }[process.env.PLAN_EXIT] ?? '失敗'
            const text = `${marker}\n### terraform plan: ${status}\n\n<details><summary>plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text })

  apply:
    name: terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
      TF_VAR_github_token: ${{ secrets.TF_VAR_github_token }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_access_emails: ${{ vars.TF_VAR_ACCESS_EMAILS || '[]' }}
    steps:
      - name: 資格情報が登録済みか
        id: creds
        working-directory: .
        run: |
          if [ -n "$TF_TOKEN_app_terraform_io" ] && [ -n "$TF_VAR_cloudflare_api_token" ] && [ -n "$TF_VAR_github_token" ] && [ -n "$TF_CLOUD_ORGANIZATION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Terraform credentials are not registered yet (infra/terraform/README.md). Skipping apply."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - if: steps.creds.outputs.configured == 'true'
        run: terraform init
      - if: steps.creds.outputs.configured == 'true'
        run: terraform apply -auto-approve -no-color
