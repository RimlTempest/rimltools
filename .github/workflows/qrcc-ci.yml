name: qrcc CI

on:
  workflow_call:

# 既定は何も無し。ジョブごとに必要な権限だけ足す（docs/security.md）。
permissions: {}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: products/qrcc

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      markup: ${{ steps.filter.outputs.markup }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            ts:
              - 'products/qrcc/apps/web/**'
              - 'products/qrcc/features/**'
              - 'products/qrcc/shared/**'
              - 'products/qrcc/e2e/**'
              - 'products/qrcc/tsconfig*.json'
              - 'products/qrcc/.oxlintrc.json'
              - 'products/qrcc/package.json'
              - 'bun.lock'
            rust:
              - 'products/qrcc/features/*/engine/**'
              - 'products/qrcc/shared/*/engine/**'
              - 'products/qrcc/features/*/worker/**'
              - 'products/qrcc/shared/*/engine/**'
              - 'products/qrcc/apps/api/**'
              - 'products/qrcc/Cargo.toml'
              - 'products/qrcc/Cargo.lock'
              - 'products/qrcc/rustfmt.toml'
            markup:
              - 'products/qrcc/**/*.tsx'
              - 'products/qrcc/.markuplintrc.json'
            web:
              - 'products/qrcc/apps/web/**'
              - 'products/qrcc/features/**'
              - 'products/qrcc/shared/ui/**'
              - 'products/qrcc/e2e/**'

  guard:
    name: 不変条件の検査
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - name: qrcc-api は公開されていないこと (ADR-0002)
        run: |
          if grep -qE '^\s*"routes"\s*:' apps/api/wrangler.jsonc; then
            echo "::error file=apps/api/wrangler.jsonc::qrcc-api must not be reachable from the internet. Remove 'routes' (ADR-0002)."
            exit 1
          fi
          # workers_dev は既定が true。routes が無くても
          # qrcc-api.<subdomain>.workers.dev で公開されるので、明示的な false を要求する。
          if ! grep -qE '^\s*"workers_dev"\s*:\s*false\s*,?\s*$' apps/api/wrangler.jsonc; then
            echo "::error file=apps/api/wrangler.jsonc::qrcc-api must set \"workers_dev\": false. It defaults to true and publishes the Worker on workers.dev even without routes (ADR-0002)."
            exit 1
          fi
      - name: 従量課金されるバインディングを足していないこと (ADR-0009)
        run: |
          # R2 は Cloudflare 側で利用上限を設定できず、超過分が従量課金される。
          # 「無料で運用する」を構造的に守るため、宣言そのものを禁じる。
          # KV は課金されないが、用途が無いので併せて弾く（ADR-0009）。
          for f in apps/web/wrangler.jsonc apps/api/wrangler.jsonc; do
            if grep -qE '^\s*"(r2_buckets|kv_namespaces)"\s*:' "$f"; then
              echo "::error file=$f::R2/KV bindings are forbidden. R2 has no spending cap and would break free-tier operation (ADR-0009)."
              exit 1
            fi
          done
      - name: engine crate は worker crate に依存しないこと (ADR-0003)
        run: |
          for f in features/*/engine/Cargo.toml shared/*/engine/Cargo.toml; do
            if grep -qE '^\s*worker(\s|\.|=)' "$f"; then
              echo "::error file=$f::engine crates must not depend on the 'worker' crate; put I/O in features/<name>/worker (ADR-0003)."
              exit 1
            fi
          done
      - name: ドメイン層に I/O が漏れていないこと
        run: |
          hits=$(find shared/contract/src features/*/contract features/*/core -name '*.ts' ! -name '*.test.ts' -print0 2>/dev/null \
            | xargs -0 -r grep -nE '\b(fetch|localStorage|process\.env)\b' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::contract and core layers must stay I/O free. Inject dependencies instead."
            exit 1
          fi
      - name: feature 同士が内部を直接 import していないこと (ADR-0007)
        run: |
          hits=$(find features \( -name '*.ts' -o -name '*.tsx' \) -print0 2>/dev/null \
            | xargs -0 -r grep -nE "from '\\.\\./\\.\\./[a-z-]+/(contract|core|ui|server)/" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::features must not reach into each other by relative path. Import via the '@qrcc/<feature>' entry points."
            exit 1
          fi

  fmt-lint:
    name: fmt + lint (oxfmt / oxlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint

  typecheck:
    name: typecheck (TypeScript 7)
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: products/qrcc }
      # wasm-bindgen が生成する .d.ts は型検査の入力。git 管理外なのでここで作る
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-ts:
    name: test (bun)
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run test

  markuplint:
    name: markuplint (a11y)
    needs: changes
    if: needs.changes.outputs.markup == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run lint:html

  rust:
    name: rust (fmt / clippy / test)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: products/qrcc }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # デコードは feature の裏にあるので、既定のワークスペーステストでは走らない
      - run: cargo test -p qrcc-wasm --features decode
      - name: ブラウザ向け wasm がビルドできること (ADR-0003)
        run: |
          cargo check -p qrcc-wasm --target wasm32-unknown-unknown
          cargo check -p qrcc-wasm --features decode --target wasm32-unknown-unknown

  build-and-a11y:
    name: build + axe (WCAG AAA)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { cache: true }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: products/qrcc }
      - run: bun install --frozen-lockfile
      - run: cargo install worker-build --locked
      - run: cargo install wasm-pack --locked
      # wasm(ブラウザ) → api(Worker) → web の順に依存している
      - run: bun run build
      - name: wasm バンドルサイズの上限を守ること (ADR-0003)
        run: |
          # ブラウザ向けは生成用とデコード用の 2 チャンクに分かれている。
          # 体感に直結するのは全画面で読む生成用なので、まとめて測らず別々に見る。
          worker=$(find apps/web/dist/qrcc_api -name '*.wasm' -exec wc -c {} + | tail -1 | awk '{print $1}')
          generate=$(find apps/web/dist/client -name 'qrcc_wasm_bg*.wasm' -exec gzip -c {} + | wc -c)
          decode=$(find apps/web/dist/client -name 'qrcc_scan_wasm_bg*.wasm' -exec gzip -c {} + | wc -c)
          echo "worker wasm: ${worker} bytes"
          echo "browser wasm: generate ${generate} bytes gzip / decode ${decode} bytes gzip"
          # 見つからないまま素通りすると、名前を変えた瞬間に検査が消える
          if [ "$generate" -eq 0 ] || [ "$decode" -eq 0 ]; then
            echo "::error::A browser wasm chunk was not found. Check the wasm-pack out-name."
            exit 1
          fi
          if [ "$worker" -gt 3000000 ]; then
            echo "::error::Worker wasm exceeded 3MB. See ADR-0003."
            exit 1
          fi
          # 生成は全画面の初期体験に効く。gzip 200KB 以内（ADR-0003）
          if [ "$generate" -gt 204800 ]; then
            echo "::error::Generation wasm exceeded 200KB gzip. See ADR-0003."
            exit 1
          fi
          # デコードは読み取り画面に入ったときだけ動的に読む。gzip 800KB 以内（ADR-0003）
          if [ "$decode" -gt 819200 ]; then
            echo "::error::Decoding wasm exceeded 800KB gzip. See ADR-0003."
            exit 1
          fi
      - run: bun run --filter '@qrcc/e2e' install-browsers
      - run: bun run a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: products/qrcc/e2e/playwright-report/
          retention-days: 7
