name: Conventional

# Conventional Commits と Conventional Comments の検査（docs/conventions.md）。
# - conventional: PR タイトル（= squash / merge で作られるコミットの件名）と PR 内の各コミット。
#   ruleset の required check。
# - conventional-comments: レビューコメント。required にはしない（返信や bot は対象外）。
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

concurrency:
  group: conventional-${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request' }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional:
    if: github.event_name == 'pull_request'
    name: conventional
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: bun
          cache: true
      - name: PR タイトルとコミットが Conventional Commits であること
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/conventional.ts pr

  conventional-comments:
    name: conventional-comments
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: bun
          cache: true
      - name: レビューコメントが Conventional Comments であること
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/conventional.ts comments
