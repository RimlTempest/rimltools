name: qrcc Deploy

# main への push で本番へ自動デプロイする。認証は GitHub の production environment の
# Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）。手動実行も残す。
# ドキュメントや計画だけの変更ではデプロイしない（Actions の無料枠を守る）。
# 使う Cloudflare リソースは D1 だけ（ADR-0009）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/qrcc/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'mise.toml'
      - '.github/workflows/qrcc-deploy.yml'
      - '!products/qrcc/**.md'
      - '!products/qrcc/docs/**'
      - '!products/qrcc/plans/**'
      - '!products/qrcc/.claude/**'
      - '!products/qrcc/scripts/lanes.tsv'

concurrency:
  group: deploy-production-qrcc
  cancel-in-progress: false

defaults:
  run:
    working-directory: products/qrcc

jobs:
  deploy:
    name: Cloudflare Workers へデプロイ
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      # 疎通確認だけが落ちた回でも、10 分超かかる Rust ビルドのキャッシュは捨てない
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true, workspaces: products/qrcc }
      - run: bun install --frozen-lockfile
      - run: cargo install worker-build --locked
      - run: cargo install wasm-pack --locked
      # wasm(ブラウザ) → api(Worker) → web の順に依存している（ci.yml の build-and-a11y と同じ）
      - run: bun run build

      - name: D1 マイグレーションを適用
        run: bunx wrangler d1 migrations apply qrcc --remote --config apps/api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # デプロイには **ビルドが生成した wrangler.json** を渡す。元の
      # wrangler.jsonc は `main` が framework の仮想エントリを指しているので、
      # そのまま渡すと "entry-point file was not found" で落ちる。
      #
      # auxiliary Worker は entry に同梱されない。service binding の解決先が
      # 先に居るよう、qrcc-api → qrcc-web の順に別々にデプロイする。
      - name: デプロイ（qrcc-api → qrcc-web の順）
        run: |
          bunx wrangler deploy -c apps/web/dist/qrcc_api/wrangler.json
          bunx wrangler deploy -c apps/web/dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 一度、エントリチャンクだけが 500 を返してクライアント JS が丸ごと
      # 動かない状態が本番に残った。HTML は 200 で返り SSR のぶんは表示される
      # ので、トップを開くだけでは気づけない。参照されている資産を全数叩く。
      # デプロイ直後は配信の切替に数十秒の揺らぎがあり、旧版の HTML が返ることがある。
      # 少し待ってから、20 秒間隔で最大 6 回（約 2 分）まで再試行する。
      - name: 疎通確認 1/2（デプロイしたものが実際に配信されているか）
        run: |
          sleep 15
          for i in 1 2 3 4 5 6; do
            if bun run smoke https://qrcc.riml4i.com/; then exit 0; fi
            echo "::notice::疎通確認 ${i}/6 が不合格。20 秒後に再試行する"
            sleep 20
          done
          echo "::error::疎通確認が 6 回とも不合格"
          exit 1

      # 配信されていても、実行時に落ちればハイドレーションは成立しない。
      # 実ブラウザで「JavaScript が動いた結果」まで見る。本番のデータは変えない
      # （サインインしない）。4 本だけなので数秒で終わる。
      - name: 疎通確認 2/2（実ブラウザで動くか）
        run: |
          bun run --filter '@qrcc/e2e' install-browsers
          bun run smoke:browser

      - name: 疎通確認の証跡を残す（落ちたときだけ）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-browser-results
          path: products/qrcc/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
