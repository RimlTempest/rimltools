# Dependabot（docs/security.md の「依存取得」層）
#
# - 版の更新（version updates）は cooldown で公開から 7 日（major は 14 日）寝かせてから PR にする。
#   乗っ取られたアカウントから出た悪性版は、多くが数日以内に発見・撤回されるため。
#   bunfig.toml の minimumReleaseAge（7 日）と同じ待ち時間に揃えている。
# - 脆弱性の修正（security updates）は cooldown の対象外で、勧告が出たらすぐ PR になる。
#   有効化はリポジトリ設定（Terraform の github_repository で管理）。
# - PR は作業ブランチの develop 宛て。CI の gate / security-gate を通ってから squash で入れる。
# - グループ名は短くする。単独の依存を上げるグループ PR の件名は
#   `chore(deps): bump <依存> from <版> to <版> in the <グループ> group` になり、conventional チェックの
#   件名の上限に掛かるため（Dependabot の PR だけ上限 120 文字。scripts/lib/conventional.ts）。
version: 2

updates:
  # bun workspaces（lockfile はルートに 1 つ）
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # 全ツールが使う依存は、major も含めて 1 本の PR で全 workspace を同時に上げる。
      # workspace ごとに版がずれると、1 つの Worker やバンドルに 2 つの版が入る
      # （better-auth で実際に起きた。scripts/check-versions.ts が CI でずれを止める）。
      # グループは上から順に当てはめられるので、この 2 つを先頭に置く。
      platform:
        applies-to: version-updates
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - '@tanstack/*'
          - 'wrangler'
          - '@cloudflare/*'
          - 'typescript'
          - 'vite'
          - '@vitejs/*'
      platform-security:
        applies-to: security-updates
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'react'
          - 'react-dom'
          - '@tanstack/*'
          - 'wrangler'
          - '@cloudflare/*'
      # それ以外の minor / patch はまとめて 1 本にする（major は個別に読んでから入れる）
      bun:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  # qrcc の Rust（engine / worker）
  - package-ecosystem: cargo
    directory: /apps/qrcc
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]

  # GitHub Actions（SHA 固定のまま、`# vX.Y.Z` コメントごと更新される）
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]

  # Terraform の provider（infra/terraform。ディレクトリができるまでは何もしない）
  - package-ecosystem: terraform
    directory: /infra/terraform
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies, terraform]
    commit-message:
      prefix: chore
      include: scope
