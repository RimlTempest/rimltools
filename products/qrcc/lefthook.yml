# Hooks are intentionally staged-file scoped so they stay fast enough to run on
# every commit. The full sweep lives in CI (`bun run check`).
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yaml,yml}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: bunx oxlint --type-aware --deny-warnings {staged_files}

    - name: markuplint
      glob: '*.{tsx,html}'
      run: bunx markuplint {staged_files}

    - name: cargo-fmt
      glob: '*.rs'
      run: cargo fmt --all -- --check

    - name: cargo-clippy
      glob: '*.rs'
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: secrets
      run: |
        if git diff --cached -U0 | grep -nE '^\+.*(BEGIN [A-Z ]*PRIVATE KEY|GOOGLE_CLIENT_SECRET\s*=\s*[^\s$]|BETTER_AUTH_SECRET\s*=\s*[^\s$]|gho_[A-Za-z0-9]{20,})'; then
          echo "Refusing to commit what looks like a secret. Put it in .dev.vars (gitignored) or a Wrangler secret." >&2
          exit 1
        fi

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 "{1}" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}' || {
          echo "Commit message must be Conventional Commits, e.g. 'feat(render): add DataMatrix support'" >&2
          exit 1
        }
