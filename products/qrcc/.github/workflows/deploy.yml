name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers へデプロイ
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo install worker-build --locked
      - run: bun run --filter '@qrcc/api' build
      - run: bun run --filter '@qrcc/web' build

      - name: D1 マイグレーションを適用
        run: bunx wrangler d1 migrations apply qrcc --remote --config apps/api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: デプロイ（entry Worker が auxiliary Worker を含む）
        run: bunx wrangler deploy --config apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
