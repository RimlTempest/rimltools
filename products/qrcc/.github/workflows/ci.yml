name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      markup: ${{ steps.filter.outputs.markup }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/web/**'
              - 'packages/**'
              - 'e2e/**'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - 'package.json'
              - 'bun.lock'
            rust:
              - 'crates/**'
              - 'apps/api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
            markup:
              - '**/*.tsx'
              - '.markuplintrc.json'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'e2e/**'

  guard:
    name: 不変条件の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: qrcc-api は公開されていないこと (ADR-0002)
        run: |
          if grep -qE '^\s*"routes"\s*:' apps/api/wrangler.jsonc; then
            echo "::error file=apps/api/wrangler.jsonc::qrcc-api must not be reachable from the internet. Remove 'routes' (ADR-0002)."
            exit 1
          fi
      - name: 純粋 crate は worker crate に依存しないこと (ADR-0003)
        run: |
          for c in qrcc-core qrcc-render qrcc-decode qrcc-print qrcc-wasm; do
            if grep -qE '^\s*worker(\s|\.|=)' "crates/$c/Cargo.toml"; then
              echo "::error file=crates/$c/Cargo.toml::$c must not depend on the 'worker' crate (ADR-0003)."
              exit 1
            fi
          done
      - name: ドメイン層に I/O が漏れていないこと
        run: |
          if grep -rnE '\b(fetch|localStorage|process\.env)\b' packages/contracts/src packages/core/src --include='*.ts' | grep -v '\.test\.ts'; then
            echo "::error::packages/contracts and packages/core must stay I/O free. Inject dependencies instead."
            exit 1
          fi

  fmt-lint:
    name: fmt + lint (oxfmt / oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint

  typecheck:
    name: typecheck (TypeScript 7)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-ts:
    name: test (bun)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run test

  markuplint:
    name: markuplint (a11y)
    needs: changes
    if: needs.changes.outputs.markup == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run lint:html

  rust:
    name: rust (fmt / clippy / test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: ブラウザ向け wasm がビルドできること (ADR-0003)
        run: |
          cargo check -p qrcc-wasm --target wasm32-unknown-unknown
          cargo check -p qrcc-wasm --features decode --target wasm32-unknown-unknown

  build-and-a11y:
    name: build + axe (WCAG AAA)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo install worker-build --locked
      - run: bun run --filter '@qrcc/api' build
      - run: bun run --filter '@qrcc/web' build
      - name: wasm バンドルサイズの上限を守ること (ADR-0003)
        run: |
          size=$(find apps/web/dist/qrcc_api -name '*.wasm' -exec wc -c {} + | tail -1 | awk '{print $1}')
          echo "wasm size: ${size} bytes"
          if [ "$size" -gt 3000000 ]; then
            echo "::error::Worker wasm exceeded 3MB. See ADR-0003."
            exit 1
          fi
      - run: bun run --filter '@qrcc/e2e' install-browsers
      - run: bun run a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
