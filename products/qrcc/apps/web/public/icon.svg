<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景: 角丸の正方形。qrcc-accent のライト側（oklch(0.44 0.16 255)）を sRGB に変換した値 -->
  <rect width="512" height="512" rx="96" fill="#004fa7" />

  <!--
    位置検出パターン（左上・右上・左下）を模した図案。
    「外枠の正方形＋内側の塗り正方形」の入れ子を 3 か所に置く。
    マスカブル対応のため、図柄はすべて中央 80%（51.2〜460.8）に収める。
  -->
  <g>
    <!-- 左上 -->
    <rect x="51.2" y="51.2" width="96" height="96" fill="#ffffff" />
    <rect x="67.2" y="67.2" width="64" height="64" fill="#004fa7" />
    <rect x="85.2" y="85.2" width="28" height="28" fill="#ffffff" />

    <!-- 右上 -->
    <rect x="364.8" y="51.2" width="96" height="96" fill="#ffffff" />
    <rect x="380.8" y="67.2" width="64" height="64" fill="#004fa7" />
    <rect x="398.8" y="85.2" width="28" height="28" fill="#ffffff" />

    <!-- 左下 -->
    <rect x="51.2" y="364.8" width="96" height="96" fill="#ffffff" />
    <rect x="67.2" y="380.8" width="64" height="64" fill="#004fa7" />
    <rect x="85.2" y="398.8" width="28" height="28" fill="#ffffff" />
  </g>

  <!-- 右下: 小さな正方形を散らして QR らしさを出す -->
  <g fill="#ffffff">
    <rect x="208" y="208" width="28" height="28" />
    <rect x="256" y="208" width="20" height="20" />
    <rect x="320" y="224" width="24" height="24" />
    <rect x="208" y="264" width="20" height="20" />
    <rect x="380" y="272" width="28" height="28" />
    <rect x="256" y="320" width="32" height="32" />
    <rect x="336" y="336" width="20" height="20" />
    <rect x="400" y="392" width="24" height="24" />
    <rect x="232" y="400" width="28" height="28" />
  </g>
</svg>
