[package]
name = "qrcc-scan"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrcc-kernel.workspace = true
serde.workspace = true
thiserror.workspace = true
# ルートの [workspace.dependencies] は他レーンの所有なので、features はここで積む。
#   multi_barcode_readers … 1 枚の画像から複数のコードを読む
#   wasm_support          … rxing は結果に現在時刻を入れる。wasm32 では
#                           chrono がプラットフォーム時計を持たず panic するので、
#                           js-sys の Date を使わせる（ブラウザと Worker の両方で必要）
rxing = { workspace = true, features = ["multi_barcode_readers", "wasm_support"] }
image.workspace = true

[dev-dependencies]
# 「生成 → デコード → 元の文字列」のラウンドトリップを回すために生成側を借りる。
# dev-dependency なので、配布されるライブラリには入らない。
qrcc-generate.workspace = true
serde_json.workspace = true

[lints]
workspace = true
