[install]
exact = true
# Wrangler resolves dependencies from each app's own package.json, so every app
# declares what it needs directly instead of relying on root hoisting.
linkWorkspacePackages = true
# markuplint など、自分自身の位置から parser を解決するツールが isolated
# レイアウトだと解決に失敗するため hoisted を明示する。
linker = "hoisted"

[test]
coverage = true
# @qrcc/ui のコンポーネントテストは DOM を要る。bunfig は cwd 基準でしか
# 解決されないため、ルートで一度だけ happy-dom を登録する。
preload = ["./shared/ui/test-setup.ts"]
