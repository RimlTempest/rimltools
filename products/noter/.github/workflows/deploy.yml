name: Deploy

# GitHub の Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）を
# 登録するまでは手動実行のみ。登録できたら push トリガーを有効化する。
# 使う Cloudflare リソースは D1 と Durable Objects だけ（ADR-0009）。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers へデプロイ
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: D1 マイグレーションを適用
        run: bunx wrangler d1 migrations apply noter --remote --config apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # デプロイには **ビルドが生成した wrangler.json** を渡す。元の
      # wrangler.jsonc は `main` が framework の仮想エントリを指しているので、
      # そのまま渡すと "entry-point file was not found" で落ちる。
      #
      # auxiliary Worker（noter-sync）は entry に同梱されない。Durable Object
      # の binding（script_name）の解決先が先に居るよう、noter-sync →
      # noter-web の順に別々にデプロイする。入れ替えると初回デプロイが落ちる。
      - name: デプロイ（noter-sync → noter-web の順）
        run: |
          bunx wrangler deploy -c apps/web/dist/noter_sync/wrangler.json
          bunx wrangler deploy -c apps/web/dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 一度、エントリチャンクだけが 500 を返してクライアント JS が丸ごと
      # 動かない状態が本番に残った（qrcc）。HTML は 200 で返り SSR のぶんは
      # 表示されるので、トップを開くだけでは気づけない。参照されている資産を
      # 全数叩き、あわせて /ws/ の入口が 426 を返すことまで見る。
      - name: 疎通確認 1/2（デプロイしたものが実際に配信されているか）
        run: bun run smoke https://noter.riml4i.com/

      # 配信されていても、実行時に落ちればハイドレーションは成立しない。
      # 実ブラウザで「JavaScript が動いた結果」まで見る。本番のデータは
      # 変えない（サインインせず、文書も作らない）。3 本だけなので速い。
      - name: 疎通確認 2/2（実ブラウザで動くか）
        run: |
          bun run --filter '@noter/e2e' install-browsers
          bun run smoke:browser
