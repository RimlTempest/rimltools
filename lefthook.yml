# Hooks are intentionally staged-file scoped so they stay fast enough to run on
# every commit. The full sweep lives in CI (`bun run check`).
# 各プロダクトの設定（.oxlintrc.json など）はプロダクト直下にあるので、
# ジョブは `root:` でプロダクトのディレクトリを cwd にして走らせる。
pre-commit:
  parallel: true
  jobs:
    - name: qrcc
      root: products/qrcc/
      group:
        parallel: true
        jobs:
          - name: qrcc-oxfmt
            glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yaml,yml}'
            run: bunx oxfmt {staged_files}
            stage_fixed: true

          - name: qrcc-oxlint
            glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
            run: bunx oxlint --type-aware --deny-warnings {staged_files}

          - name: qrcc-markuplint
            glob: '*.{tsx,html}'
            # TypeScript 6 に固定した隔離インストールのバイナリを、プロダクトのルートを
            # cwd にしたまま起動する（ADR-0006 / tools/markuplint）
            run: node tools/markuplint/node_modules/markuplint/bin/markuplint.mjs --config .markuplintrc.json {staged_files}

          - name: qrcc-cargo-fmt
            glob: '*.rs'
            run: cargo fmt --all -- --check

          - name: qrcc-cargo-clippy
            glob: '*.rs'
            run: cargo clippy --workspace --all-targets -- -D warnings

    - name: noter
      root: products/noter/
      group:
        parallel: true
        jobs:
          - name: noter-oxfmt
            glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yaml,yml}'
            run: bunx oxfmt {staged_files}
            stage_fixed: true

          - name: noter-oxlint
            glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
            run: bunx oxlint --type-aware --deny-warnings {staged_files}

          - name: noter-markuplint
            glob: '*.{tsx,html}'
            # TypeScript 6 に固定した隔離インストールのバイナリを、プロダクトのルートを
            # cwd にしたまま起動する（ADR-0006 / tools/markuplint）
            run: node tools/markuplint/node_modules/markuplint/bin/markuplint.mjs --config .markuplintrc.json {staged_files}

    # プロダクト外（scripts/・packages/・docs/ など）。glob は group ではなく各ジョブに書く
    # （group の glob は中のジョブの glob を上書きしてしまう）
    - name: root
      group:
        parallel: true
        jobs:
          - name: root-oxfmt
            glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yaml,yml}'
            exclude:
              - 'products/**'
            run: bunx oxfmt {staged_files}
            stage_fixed: true

          - name: root-oxlint
            glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
            exclude:
              - 'products/**'
            run: bunx oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern {staged_files}

    - name: secrets
      run: |
        # gitleaks（docs/security.md）があれば staged の差分を既定ルール + .gitleaks.toml で検査する。
        # 入っていない端末では下の簡易パターンに落ちる（CI の security.yml が全ルールで見直す）。
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml || {
            echo "Refusing to commit what looks like a secret. Put it in .dev.vars (gitignored) or a Wrangler secret." >&2
            exit 1
          }
          exit 0
        fi
        # *.example は値が空なので対象外。値が空文字/空のものは検出しない。
        if git diff --cached -U0 -- ':!*.example' | grep -nE '^\+.*(BEGIN [A-Z ]*PRIVATE KEY|(GOOGLE_CLIENT_SECRET|BETTER_AUTH_SECRET|GOOGLE_CLIENT_ID)\s*[=:]\s*"?[A-Za-z0-9_.~/+-]{8,}|gho_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})'; then
          echo "Refusing to commit what looks like a secret. Put it in .dev.vars (gitignored) or a Wrangler secret." >&2
          exit 1
        fi

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: conventional-commit
      # 検査ロジックは CI（conventional.yml）と共通（scripts/lib/conventional.ts）
      run: bun scripts/conventional.ts commit-msg {1}
