# infra/secrets/apply.sops.yaml のひな形（値は空のまま）。main の apply が使う**書き込み用**の資格情報。
# apply 鍵でしか開けない。作り方は plan.example.yaml と同じ（README）。

# tfstate Worker の書き込み用の資格情報（ロック・保存）
TF_HTTP_USERNAME: ''
TF_HTTP_PASSWORD: ''
# state / plan の暗号化パスフレーズ（plan と同じ値。32 文字以上）
TF_VAR_state_passphrase: ''
# Cloudflare の書き込みトークン（infra/terraform/README.md の apply 用の権限）
TF_VAR_cloudflare_api_token: ''
# GitHub の書き込み用 fine-grained PAT
TF_VAR_github_token: ''
# Grafana Cloud の apply 用 access policy token
TF_VAR_grafana_cloud_access_policy_token: ''
