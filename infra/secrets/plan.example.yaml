# infra/secrets/plan.sops.yaml のひな形（値は空のまま）。PR の plan が使う**読み取り専用**の資格情報。
# 作り方: cp plan.example.yaml plan.sops.yaml → 値を入れる → sops encrypt -i plan.sops.yaml（README）
# キーは環境変数名そのもの（CI が sops exec-env で渡す）。

# tfstate Worker の読み取り専用の資格情報（GET だけ）
TF_HTTP_USERNAME: ''
TF_HTTP_PASSWORD: ''
# state / plan の暗号化パスフレーズ（apply と同じ値。32 文字以上）
TF_VAR_state_passphrase: ''
# Cloudflare の読み取り専用トークン（infra/terraform/README.md の plan 用の権限）
TF_VAR_cloudflare_api_token: ''
# GitHub の読み取り専用 fine-grained PAT
TF_VAR_github_token: ''
# Grafana Cloud の plan 用 access policy token
TF_VAR_grafana_cloud_access_policy_token: ''
