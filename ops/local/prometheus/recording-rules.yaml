# ローカル専用。本番では scripts/ops/push-metrics.ts が Cloudflare GraphQL の値を
# rimltools_worker_* として Mimir に送る。ローカルには GraphQL が無いので、Tempo の
# span metrics（SERVER の span）から同じ名前・同じラベルの系列を作り、概要ダッシュボードを
# ローカルでも同じように映す。
#
# 本番との違い:
#   - environment は常に "local"
#   - 値は「5 分窓の件数 / 分位点」（本番の 5 分窓の gauge に合わせる）
#   - CPU 時間（rimltools_worker_cpu_time_ms）は span に無いので作らない（パネルは空になる）
#   - サンプリングで捨てた span は数えられない。ローカルでは OTEL_TRACES_SAMPLER_ARG=1 にする
#
# tool は service（= Worker 名）から導く: qrcc-web / qrcc-api → qrcc、noter-web / noter-sync → noter、
# rimltools-portal → portal。
groups:
  - name: rimltools-local
    interval: 30s
    rules:
      - record: rimltools_worker_requests
        expr: >-
          label_replace(label_replace(
            sum by (service) (increase(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code!="STATUS_CODE_ERROR"}[5m])),
          "tool", "$1", "service", "^(?:rimltools-)?([a-z0-9]+?)(?:-(?:web|api|sync))?$"),
          "script", "$1", "service", "(.*)")
        labels:
          environment: local
          status_class: ok
      - record: rimltools_worker_requests
        expr: >-
          label_replace(label_replace(
            sum by (service) (increase(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m])),
          "tool", "$1", "service", "^(?:rimltools-)?([a-z0-9]+?)(?:-(?:web|api|sync))?$"),
          "script", "$1", "service", "(.*)")
        labels:
          environment: local
          status_class: error
      - record: rimltools_worker_errors
        expr: >-
          label_replace(label_replace(
            sum by (service) (increase(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m])),
          "tool", "$1", "service", "^(?:rimltools-)?([a-z0-9]+?)(?:-(?:web|api|sync))?$"),
          "script", "$1", "service", "(.*)")
        labels:
          environment: local
          status_class: error
      - record: rimltools_worker_wall_time_ms
        expr: >-
          label_replace(label_replace(
            1000 * histogram_quantile(0.5, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER"}[5m]))),
          "tool", "$1", "service", "^(?:rimltools-)?([a-z0-9]+?)(?:-(?:web|api|sync))?$"),
          "script", "$1", "service", "(.*)")
        labels:
          environment: local
          quantile: '0.5'
      - record: rimltools_worker_wall_time_ms
        expr: >-
          label_replace(label_replace(
            1000 * histogram_quantile(0.9, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER"}[5m]))),
          "tool", "$1", "service", "^(?:rimltools-)?([a-z0-9]+?)(?:-(?:web|api|sync))?$"),
          "script", "$1", "service", "(.*)")
        labels:
          environment: local
          quantile: '0.9'
      - record: rimltools_worker_wall_time_ms
        expr: >-
          label_replace(label_replace(
            1000 * histogram_quantile(0.99, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER"}[5m]))),
          "tool", "$1", "service", "^(?:rimltools-)?([a-z0-9]+?)(?:-(?:web|api|sync))?$"),
          "script", "$1", "service", "(.*)")
        labels:
          environment: local
          quantile: '0.99'
